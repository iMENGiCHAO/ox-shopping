# ============================================================
# 生产部署编排（严格模式：密钥全部来自环境，缺项直接报错拒启）
# 本地一键演示请叠加本地覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# 生产先准备 .env（参考 .env.example），然后：
#   docker compose up -d --build
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?请在 .env 配置 SITE_URL}
      # 注意：密码含特殊字符时需 URL 编码
      DATABASE_URL: postgresql://ecommerce:${POSTGRES_PASSWORD}@postgres:5432/ecommerce?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      CACHE_TTL: ${CACHE_TTL:-60}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请配置 ≥32 位随机密钥（openssl rand -base64 48）}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请配置 ≥32 位随机密钥（openssl rand -base64 48）}
      ACCESS_TOKEN_TTL: "900"
      REFRESH_TOKEN_TTL: "604800"
      PAYMENT_MODE: ${PAYMENT_MODE:-auto}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CURRENCY: ${CURRENCY:-USD}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_FROM: ${MAIL_FROM:-"Ox Shopping <no-reply@example.com>"}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ecommerce}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: "true"
      UPLOAD_MAX_BYTES: "10485760"
      SHIPPING_FEE: ${SHIPPING_FEE:-10}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-99}
      TAX_RATE: ${TAX_RATE:-0}
      ORDER_EXPIRE_SECONDS: ${ORDER_EXPIRE_SECONDS:-1800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 生产默认在可信反代（nginx/CDN）之后：取 X-Forwarded-For 最后一跳
      TRUST_PROXY: "true"
      # 生产默认不执行种子；本地演示叠加 compose.local 时置 true
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  pgdata:
  redisdata:
