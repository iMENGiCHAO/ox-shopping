# ============================================================
# 生产部署编排（严格模式：密钥全部来自环境，缺项直接报错拒启）
# 本地一键演示请叠加本地覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# 生产先准备 .env（参考 .env.example），然后：
#   docker compose up -d --build
# ============================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce
    ports:
      # 仅绑定 loopback：数据库端口绝不对外（宿主机上的备份/排障工具仍可用）
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 日志轮转（P1）：local 驱动默认无限增长，磁盘会被容器日志打满
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    # 强制密码（B2）：无密码 Redis 可被任何可达进程清空限流计数、伪造缓存
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 配置 REDIS_PASSWORD（openssl rand -hex 24）}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 配置 REDIS_PASSWORD（openssl rand -hex 24）}
    ports:
      # 仅绑定 loopback：外部网络不可达（容器间通过 compose 网络访问）
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      # 带密码探活（--no-auth-warning 避免密码进日志）
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?请在 .env 配置 SITE_URL}
      # 密码含 @ : / ? # % 等字符时，完整 URL 必须使用 URL 编码后的凭据：
      # DATABASE_URL=postgresql://ecommerce:<encodeURIComponent(password)>@postgres:5432/ecommerce?schema=public
      # 默认值仅适用于无特殊字符密码；推荐生产直接显式提供完整 URL。
      DATABASE_URL: ${DATABASE_URL:-postgresql://ecommerce:${POSTGRES_PASSWORD}@postgres:5432/ecommerce?schema=public}
      # 同源密码在 Redis 服务侧使用原值，应用侧完整 URL 必须使用 URL 编码后的值。
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?请在 .env 配置 REDIS_PASSWORD（openssl rand -hex 24）}@redis:6379}
      REDIS_ENABLED: "true"
      CACHE_TTL: ${CACHE_TTL:-60}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请配置 ≥32 位随机密钥（openssl rand -base64 48）}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请配置 ≥32 位随机密钥（openssl rand -base64 48）}
      ACCESS_TOKEN_TTL: "900"
      REFRESH_TOKEN_TTL: "604800"
      PAYMENT_MODE: ${PAYMENT_MODE:-auto}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # ⚠️ 必填：支付渠道密钥的加密主密钥（AES-256-GCM）。不传则 env.ts 的生产守卫
      #    直接拒绝启动（容器会反复重启），而旧 preflight 只校验 4 个变量、会误报 PASS（P0-4）。
      PAYMENT_CHANNEL_ENC_KEY: ${PAYMENT_CHANNEL_ENC_KEY:?请在 .env 配置 PAYMENT_CHANNEL_ENC_KEY（openssl rand -base64 32）}
      CURRENCY: ${CURRENCY:-USD}
      # ⚠️ 品牌名必填：留空会回落占位名，env.ts 的生产守卫会拒绝启动（P0-4）
      SITE_NAME: ${SITE_NAME:?请在 .env 配置 SITE_NAME（站点品牌名）}
      # 邮件：默认 console 会让生产环境的订单确认/发货/退款邮件全部丢失（只落容器日志，
      # 还会往容器盘写 .mail-out 文件）。生产必须显式选择 resend / smtp（P1-2）。
      MAIL_PROVIDER: ${MAIL_PROVIDER:?请在 .env 配置 MAIL_PROVIDER（resend | smtp；本机演示才用 console）}
      # 留空 → 由 SITE_NAME + SITE_URL 域名自动拼出（不再预设 example.com，否则架空发件域守卫）（P1-3）
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # 生产默认强制 S3；env.ts 会在六项 S3 配置缺失时拒绝启动，不再静默退回 local。
      # 本地 compose.local.yml 会显式覆盖为内置 MinIO。
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ecommerce}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      UPLOAD_MAX_BYTES: "10485760"
      SHIPPING_FEE: ${SHIPPING_FEE:-10}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-99}
      TAX_RATE: ${TAX_RATE:-0}
      ORDER_EXPIRE_SECONDS: ${ORDER_EXPIRE_SECONDS:-1800}
      # Sentry 可选；配置错误 DSN 会由 env.ts 启动时拒绝。
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # TZ 必须在 Node 进程启动前设置；APP_TIMEZONE 供应用配置显式记录/校验。
      TZ: ${TZ:-UTC}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 生产默认在可信反代（nginx/CDN）之后：取 X-Forwarded-For 最后一跳
      TRUST_PROXY: "true"
      # 生产默认不执行种子；本地演示叠加 compose.local 时置 true
      SEED_ON_START: ${SEED_ON_START:-false}
      # ------------------------------------------------------------------
      # 以下为此前 compose 漏传、但 env.ts / 业务代码会读取的变量（P1 修复）：
      # compose environment 不会自动带入未列出的 .env 变量，漏传意味着
      # 运维在 .env 修改这些项**完全不生效**。
      # ------------------------------------------------------------------
      # 四道生产 fail-fast 守卫总开关：默认开启；确有豁免需求时在 .env 显式写 false
      REQUIRE_STRONG_SECRETS: ${REQUIRE_STRONG_SECRETS:-true}
      ALLOW_MOCK_PAYMENT_IN_PROD: ${ALLOW_MOCK_PAYMENT_IN_PROD:-false}
      ALLOW_PASSWORDLESS_REDIS_IN_PROD: ${ALLOW_PASSWORDLESS_REDIS_IN_PROD:-false}
      # bcrypt 成本因子（生产低于 10 拒绝启动，见 src/lib/auth/password.ts）
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # 会话 Cookie 域（如 .example.com；空 = 当前域）
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # 进程内定时任务（订单超时取消 / 令牌清理 / 掉单对账 / 退款 outbox 重试）
      CRON_ENABLED: ${CRON_ENABLED:-true}
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-60}
      # 分销模块总开关（false = API 全 404、入口隐藏、钩子零调用）
      DISTRIBUTION_ENABLED: ${DISTRIBUTION_ENABLED:-true}
      # 客服联系方式兜底（后台「站点设置」未填写时使用）
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      # 发票 PDF 内嵌中文字体路径（留空用 public/fonts 内置字体）
      INVOICE_FONT_PATH: ${INVOICE_FONT_PATH:-}
      # console 邮件驱动落盘目录（生产 MAIL_PROVIDER 必须是 resend/smtp，此项仅兜底）
      MAIL_OUT_DIR: ${MAIL_OUT_DIR:-}
    ports:
      # ⚠️ 仅绑定 loopback（安全基线）：应用只允许宿主机上的可信反代访问。
      # 若直接对外发布 3000，客户端可自带 X-Forwarded-For 伪造来源 IP，
      # 从而绕过所有按 IP 的限流（登录/注册/下单）并污染审计日志。
      # 反代侧建议覆盖写入：proxy_set_header X-Forwarded-For $remote_addr;
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  # ------------------------------------------------------------------
  # 每日自动备份侧车（P1：此前备份只能靠宿主机手工 cron 跑 scripts/backup-db.sh，
  # 漏装 = 数据丢失不可恢复）。镜像与 postgres 同源，pg_dump 客户端版本必然匹配。
  # 输出到命名卷 dbbackups，格式/命名与 scripts/backup-db.sh 完全一致
  # （pg_dump 自定义格式 + gzip + SHA-256），scripts/restore-db.sh 可直接恢复。
  # 卷内容仍需每日同步到异地对象存储（见 docs/PRODUCTION_CHECKLIST.md §三）。
  # ------------------------------------------------------------------
  db-backup:
    image: postgres:16-alpine
    container_name: ecommerce-db-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ecommerce
      PGDATABASE: ecommerce
      # 与 postgres 服务同源取值；密码只存在于容器环境（与 postgres 服务同暴露面）
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env 配置 POSTGRES_PASSWORD}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
    volumes:
      - dbbackups:/backups
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "[db-backup] 启动：每日备份一次（pg_dump 自定义格式 + gzip + SHA-256），保留 $${BACKUP_RETAIN_DAYS:-14} 天"
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          tmp=/backups/ecommerce-$$ts.dump.tmp
          out=/backups/ecommerce-$$ts.dump.gz
          if pg_dump --format=custom --no-owner --no-privileges --file="$$tmp"; then
            if gzip -c "$$tmp" > "$$out.partial" && [ -s "$$out.partial" ]; then
              mv "$$out.partial" "$$out"
              sha256sum "$$out" > "$$out.sha256"
              echo "[db-backup] ✓ $$out"
            else
              echo "[db-backup] ✗ gzip/落盘失败，丢弃本轮备份"
              rm -f "$$out.partial"
            fi
          else
            echo "[db-backup] ✗ pg_dump 失败（下一轮自动重试）"
          fi
          rm -f "$$tmp"
          find /backups -type f \( -name 'ecommerce-*.dump.gz' -o -name 'ecommerce-*.dump.gz.sha256' -o -name 'ecommerce-*.dump.gz.partial' -o -name 'ecommerce-*.dump.tmp' \) -mtime "+$${BACKUP_RETAIN_DAYS:-14}" -delete
          sleep 86400
        done

volumes:
  pgdata:
  redisdata:
  dbbackups:
