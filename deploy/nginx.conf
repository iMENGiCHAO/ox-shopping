# 生产环境 Nginx 反向代理配置
# 放在 /etc/nginx/conf.d/ecommerce.conf
# 前提：SSL 证书位于 /etc/nginx/ssl/（使用 certbot 申请）
#
# 上游指向 docker-compose 中的 app 服务（单实例）或负载均衡组。
# 若 app 运行在宿主机 3000 端口：upstream 用 127.0.0.1:3000

upstream ecommerce_app {
    server app:3000;
    keepalive 32;
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（应用层已设置，这里兜底）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 12m;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 存活探针：只证明 Node 进程可响应，不访问数据库。
    location = /api/healthz {
        access_log off;
        proxy_pass http://ecommerce_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # 就绪探针：应用会真实查询 PostgreSQL，失败返回 503，Nginx/负载均衡据此摘流量。
    location = /healthz {
        access_log off;
        proxy_pass http://ecommerce_app;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    # 静态资源：Next.js 构建产物带内容哈希，可长缓存
    location /_next/static/ {
        proxy_pass http://ecommerce_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖写入（丢弃客户端伪造的 X-Forwarded-For），应用取最后一跳即真实客户端 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://ecommerce_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
