# ============================================================
# 本地一键演示覆盖文件（严禁用于生产）：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# 覆盖项：明文弱密钥、模拟支付、MinIO 对象存储、启动种子、跳过生产密钥强度检查。
# ============================================================
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ecommerce

  redis:
    # 本地演示用弱密码（生产必须换随机值；见 .env.example 的 REDIS_PASSWORD）
    environment:
      REDIS_PASSWORD: ecommerce-local-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ecommerce-local-redis
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG

  # 本地演示对象存储：MinIO 已于 2025-10 官宣停发免费镜像并从 Docker Hub / quay.io
  # 全部撤下（pull access denied），本地演示改用 RustFS——S3 兼容的直接替代
  # （9000=S3 API，9001=控制台）。凭据沿用 minioadmin/minioadmin 演示约定。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ecommerce-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      # CI runner / Mac 的容器存储多为 overlayfs，会触发 RustFS 严格的磁盘拓扑检查；
      # 本地演示无数据可靠性诉求，显式跳过（生产存储不适用本文件）。
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 桶初始化：minio/mc 镜像同样已撤下，改用 AWS 官方 CLI 镜像（SigV4 标准 S3 调用）。
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: ecommerce-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws s3api head-bucket --bucket ecommerce --endpoint-url http://rustfs:9000 2>/dev/null ||
      aws s3api create-bucket --bucket ecommerce --endpoint-url http://rustfs:9000 &&
      aws s3api put-bucket-policy --bucket ecommerce --endpoint-url http://rustfs:9000 --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::ecommerce/*"}]}' &&
      echo 'RustFS bucket ecommerce ready (public read)'"

  app:
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/ecommerce?schema=public
      REDIS_URL: redis://:ecommerce-local-redis@redis:6379
      # 本地演示：显式提供生产 compose 里必填的品牌名与渠道加密主密钥（生产必须换随机值）
      SITE_NAME: Ox Shopping
      PAYMENT_CHANNEL_ENC_KEY: local-demo-payment-channel-enc-key-change-me
      JWT_ACCESS_SECRET: docker-compose-access-secret-change-in-prod
      JWT_REFRESH_SECRET: docker-compose-refresh-secret-change-in-prod
      # 仅限本地演示：跳过生产密钥强度检查
      REQUIRE_STRONG_SECRETS: "false"
      PAYMENT_MODE: mock
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      CURRENCY: CNY
      MAIL_PROVIDER: console
      # 本地演示保留 example.com（仅写日志/落文件）；生产不得预设此域（会架空发件域守卫）
      MAIL_FROM: "Ox Shopping <no-reply@example.com>"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: ecommerce
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost:9000/ecommerce
      S3_FORCE_PATH_STYLE: "true"
      SEED_ON_START: "true"
      # 演示账号（admin@example.com 等）：容器内 NODE_ENV=production 会让种子
      # 默认跳过它们（生产护栏），本地演示必须显式开启，否则后台无法登录。
      SEED_DEMO_ACCOUNTS: "true"

volumes:
  miniodata:
