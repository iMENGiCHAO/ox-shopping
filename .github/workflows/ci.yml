name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_test?schema=public

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      # 交付审计：qa:static（硬编码扫描 / 顾客可见错误文案语言 / 静态死链）
      # 此前零 CI 门禁，只能在开发者本机拦 —— PR 可带病合入
      - name: QA 静态门禁（硬编码 / 错误文案 / 死链）
        run: npm run qa:static

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit（运行时依赖 high/critical 阻断）
        # --omit=dev：只审计生产运行时依赖（standalone 镜像不含 devDependencies）。
        # dev 链上已知的 braces GHSA-vfj7-8cjw-p6xm（tailwindcss→chokidar→braces、
        # eslint-config-next→fast-glob→micromatch→braces，文件监视/静态分析工具）
        # 目前**无任何已修复版本可升**（braces 3.0.3 即最新），唯一根治是 tailwind 4
        # 迁移——已立项跟踪，不作为运行时安全门禁的阻断项。运行时依赖（undici/nodemailer
        # 等）依旧零容忍：出现即红。
        run: npm audit --omit=dev --audit-level=high

  migration-gate:
    name: Empty DB Migration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_migration_test?schema=public
      SHADOW_DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_migration_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: 创建只供 diff 使用的空 shadow DB
        run: echo 'CREATE DATABASE ecommerce_migration_shadow;' | npx prisma db execute --stdin --url "$DATABASE_URL"
      - name: 在完全空库执行全部迁移
        run: npx prisma migrate deploy
      - name: 确认没有未应用或失败迁移
        run: npx prisma migrate status
      - name: 比较迁移历史与 Prisma schema
        shell: bash
        run: |
          set -uo pipefail
          drift=/tmp/migration-drift.sql
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --script > "$drift"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "迁移历史与 schema 完全一致"
            exit 0
          fi
          if [[ $status -ne 2 ]]; then
            cat "$drift"
            exit "$status"
          fi
          # Prisma schema 无法表达该部分唯一索引；迁移历史有意保留它。
          unexpected="$(sed '/^-- DropIndex$/d; /^DROP INDEX "withdraw_records_one_inflight_per_user";$/d' "$drift" | sed '/^[[:space:]]*$/d')"
          if [[ -n "$unexpected" ]]; then
            echo "检测到迁移历史与 schema 的非预期差异："
            cat "$drift"
            exit 1
          fi
          echo "仅存在已登记的 raw partial unique index 差异"

  backup-restore-drill:
    # 交付审计：备份此前只做 pg_dump + 非空校验，**从未验证过可恢复性** ——
    # 不可恢复的备份等于没有备份。本 job 在真实 Postgres 上跑完整
    # dump → 建临时库 → restore → 表数/关键表校验 → 清理。
    name: Backup Restore Drill
    runs-on: ubuntu-latest
    needs: [migration-gate]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_drill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_drill?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: 建表（空库跑全量迁移）
        run: npx prisma migrate deploy
      - name: 备份可恢复性演练
        run: bash scripts/backup-restore-drill.sh

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit Tests
        run: npm run test:unit
      - name: Integration Tests（自动 db push + seed）
        run: npm run test:integration
        env:
          REDIS_URL: redis://localhost:6379
          REDIS_ENABLED: "false"
          PAYMENT_MODE: mock
          MAIL_PROVIDER: console
          STORAGE_DRIVER: local

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Next.js Build
        run: npm run build
        env:
          PAYMENT_MODE: mock
          MAIL_PROVIDER: console
          STORAGE_DRIVER: local

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 准备数据库（生产迁移路径 + 种子）
        run: |
          echo "DATABASE_URL=postgresql://ecommerce:ecommerce@localhost:5432/ecommerce?schema=public" > .env
          echo "PAYMENT_MODE=mock" >> .env
          echo "MAIL_PROVIDER=console" >> .env
          echo "STORAGE_DRIVER=local" >> .env
          echo "REDIS_ENABLED=false" >> .env
          npx prisma migrate deploy
          npm run db:seed
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-smoke:
    name: Final Docker Build & Start Smoke
    runs-on: ubuntu-latest
    needs: [lint-typecheck, audit, migration-gate, test, build, e2e]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_docker_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_docker_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 构建最终生产镜像
        run: docker build --progress=plain --tag ox-shopping:ci-smoke .
      - name: 启动容器并验证迁移、livez、readyz
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ox-shopping-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e SITE_URL=http://127.0.0.1:3000 \
            -e SITE_NAME="Ox Shopping CI" \
            -e DATABASE_URL=postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_docker_smoke?schema=public \
            -e REDIS_ENABLED=false \
            -e REQUIRE_STRONG_SECRETS=false \
            -e PAYMENT_MODE=mock \
            -e MAIL_PROVIDER=console \
            -e STORAGE_DRIVER=local \
            ox-shopping:ci-smoke
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:3000/api/healthz | grep -q '"probe":"livez"'
          curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            http://127.0.0.1:3000/healthz | grep -q '"database":"ok"'
      - name: 输出容器日志
        if: always()
        run: docker logs ox-shopping-smoke || true
      - name: 清理 smoke 容器
        if: always()
        run: docker rm --force ox-shopping-smoke || true

  compose-smoke:
    # 运维审计 H2（覆盖缺口）：compose 是文档承诺的部署路径，历史上两次 P0
    # （「生产/演示两条路径全部起不来」）都发生在 compose 编排层 —— 而 raw
    # `docker run` 的 docker-smoke 探不到 compose（env 插值 / SEED_ON_START /
    # depends_on 健康门 / minio 初始化 / db-backup sidecar）。这里跑完整的
    # scripts/smoke-compose.sh：构建→起栈→迁移→种子→健康→关键页→后台登录→日志无 ERROR。
    name: Docker Compose Full-Stack Smoke
    runs-on: ubuntu-latest
    needs: [docker-smoke]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 运行 compose 冒烟（本地演示模式，无需任何 .env）
        run: bash scripts/smoke-compose.sh
