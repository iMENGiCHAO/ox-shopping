name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://ecommerce:ecommerce@localhost:5432/ecommerce_test?schema=public

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit Tests
        run: npm run test:unit
      - name: Integration Tests（自动 db push + seed）
        run: npm run test:integration
        env:
          REDIS_URL: redis://localhost:6379
          REDIS_ENABLED: "false"
          PAYMENT_MODE: mock
          MAIL_PROVIDER: console
          STORAGE_DRIVER: local

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Next.js Build
        run: npm run build
        env:
          PAYMENT_MODE: mock
          MAIL_PROVIDER: console
          STORAGE_DRIVER: local

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 准备数据库（迁移 + 种子）
        run: |
          echo "DATABASE_URL=postgresql://ecommerce:ecommerce@localhost:5432/ecommerce?schema=public" > .env
          echo "PAYMENT_MODE=mock" >> .env
          echo "MAIL_PROVIDER=console" >> .env
          echo "STORAGE_DRIVER=local" >> .env
          echo "REDIS_ENABLED=false" >> .env
          # db push 前先归一历史数据（tierLevel NOT NULL 等），否则 db push 拒绝执行
          npx prisma db execute --file prisma/sql/pre-push-normalize.sql
          npx prisma db push --skip-generate
          # db push 会删掉 schema 表达不了的原始索引（提现「一用户一笔在途」部分唯一索引），必须重建
          npx prisma db execute --file prisma/sql/raw-indexes.sql
          npm run db:seed
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
